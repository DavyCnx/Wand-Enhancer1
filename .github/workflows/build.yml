name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Web Panel (if needed)
        run: |
          if (Test-Path "web-panel/package.json") {
            cd web-panel
            npm install
            npm run build
          }

      - name: Publish EXE
        run: dotnet publish WandEnhancer -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ./output

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wand-Enhancer-EXE
          path: ./output/*.exe
